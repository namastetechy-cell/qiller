name: Badlo Windows build

on:
  push:
    paths:
      - "badlo/**"
      - ".github/workflows/badlo-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: badlo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: badlo/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: badlo/src-tauri

      - run: npm ci

      - name: Check licences
        run: npm run licenses

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: badlo-windows-installers
          path: |
            badlo/src-tauri/target/release/bundle/msi/*.msi
            badlo/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
