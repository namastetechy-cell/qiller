<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Whysplained Logo Reveal</title>
<style>
  @font-face { font-family: "Montserrat"; font-weight: 800; src: url("fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Montserrat"; font-weight: 900; src: url("fonts/montserrat-latin-900-normal.woff2") format("woff2"); }
  /* Tokens — from whysplained/README.md brand knobs (yellow #FFD400 on black, Montserrat 800/900) */
  :root {
    --ink: #0d0c0a;      /* warm black ground */
    --accent: #ffd400;   /* the one accent */
    --paper: #f4f1ea;    /* warm off-white for the second half of the name */
    --font: "Montserrat", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
  #stage { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #lockup { position: absolute; left: 0; top: 0; }
  #mark { position: absolute; overflow: visible; width: 200px; height: 200px; left: -100px; top: -100px; z-index: 2; }
  #word { position: absolute; z-index: 1; white-space: nowrap; font-family: var(--font); font-weight: 900;
          font-size: 150px; line-height: 1; letter-spacing: -0.01em; }
  #word .why { color: var(--accent); }
  #word .spl { color: var(--paper); }
  #under { position: absolute; z-index: 1; height: 12px; background: var(--accent); transform-origin: 0 50%; border-radius: 6px; }
</style>
</head>
<body>
<div id="stage"><div id="lockup">
  <div id="word"><span class="why">WHY</span><span class="spl" id="spl">SPLAINED</span></div>
  <div id="under"></div>
  <svg id="mark" viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <clipPath id="tileClip"><rect id="clipRect" x="0" y="0" width="200" height="200" rx="46" /></clipPath>
    </defs>
    <rect id="tile" x="0" y="0" width="200" height="200" rx="46" fill="var(--accent)" />
    <g transform="translate(0 10)">
      <!-- the question, in yellow on the ground -->
      <path id="qY" d="M64 62 C64 26 136 26 136 62 C136 92 100 96 100 120" fill="none" stroke="var(--accent)" stroke-width="26" stroke-linecap="round" />
      <circle id="dotY" cx="100" cy="155" r="15" fill="var(--accent)" />
      <!-- the same question in ink, visible only where the tile has grown -->
      <g clip-path="url(#tileClip)">
        <path id="qK" d="M64 62 C64 26 136 26 136 62 C136 92 100 96 100 120" fill="none" stroke="var(--ink)" stroke-width="26" stroke-linecap="round" />
        <circle id="dotK" cx="100" cy="155" r="15" fill="var(--ink)" />
      </g>
    </g>
  </svg>
</div></div>
<script>
// Every frame is a pure function of t. One TIMELINE holds every beat, move and cue.
// 120 bpm: beats at 0.5 s; key actions land on beats so the sound bed can lock to them.
const TIMELINE = {
  duration: 3.0, bpm: 120,
  dotFall:   [0.00, 0.50],  // dot drops in, lands on beat 1        (cue: tick)
  qDraw:     [0.50, 1.00],  // question curve draws up from the dot (cue: soft air)
  tileGrow:  [1.00, 1.35],  // yellow tile grows, ? turns ink        (cue: motif note 1, "the question")
  reframe:   [1.25, 1.85],  // mark slides to its lockup place
  wordWipe:  [1.35, 1.95],  // WHYSPLAINED wipes out from behind the mark
  underline: [1.95, 2.35],  // the answer lands under SPLAINED      (cue: motif note 2, "the answer")
  hold:      [2.35, 3.00],  // everything still
};
window.TIMELINE = TIMELINE;

const REDUCED = new URLSearchParams(location.search).has("reduced");

// cubic-bezier solver (custom easings, all settle without overshoot)
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = s => ((ax * s + bx) * s + cx) * s, sy = s => ((ay * s + by) * s + cy) * s;
  const dx = s => (3 * ax * s + 2 * bx) * s + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let s = x;
    for (let i = 0; i < 8; i++) { const e = sx(s) - x; const d = dx(s); if (Math.abs(e) < 1e-7 || Math.abs(d) < 1e-6) break; s -= e / d; }
    let lo = 0, hi = 1; for (let i = 0; i < 30 && Math.abs(sx(s) - x) > 1e-7; i++) { if (sx(s) < x) lo = s; else hi = s; s = (lo + hi) / 2; }
    return sy(s);
  };
}
const settle = bezier(0.16, 0.84, 0.24, 1);  // arrive and settle
const glide  = bezier(0.62, 0.0, 0.22, 1);   // reframe between ideas
const fall   = bezier(0.5, 0.0, 0.3, 1);     // gravity-ish drop that settles, no bounce
const prog = (t, [a, b]) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;

const $ = id => document.getElementById(id);
let L = null; // layout, measured once fonts are ready

function layout() {
  const W = innerWidth, H = innerHeight;
  const word = $("word"), spl = $("spl");
  const ww = word.offsetWidth, wh = 150 * 0.72; // cap height of Montserrat ~0.72em
  const splLeft = spl.offsetLeft, splW = spl.offsetWidth;
  const tall = H / W > 1.3;
  const MS = tall ? 1.3 : 1;   // stacked lockup carries a bigger mark for phone screens
  const gap = tall ? 64 : 56, tile = 200 * MS;
  let lockW, lockH, markX, markY, wordX, wordY;
  if (!tall) { // horizontal lockup: [?] WHYSPLAINED
    lockW = tile + gap + ww; lockH = tile;
    markX = -lockW / 2 + tile / 2; markY = 0;
    wordX = markX + tile / 2 + gap; wordY = -wh / 2 - 12;
  } else {     // stacked lockup for 9:16
    lockW = Math.max(tile, ww); lockH = tile + gap + wh + 60;
    markX = 0; markY = -lockH / 2 + tile / 2;
    wordX = -ww / 2; wordY = markY + tile / 2 + gap - 0.14 * 150;
  }
  const scale = Math.min((W * (tall ? 0.84 : 0.74)) / lockW, (H * 0.6) / lockH);
  L = { W, H, tall, scale, MS, markX, markY, wordX, wordY, ww, splLeft, splW, wh, len: $("qY").getTotalLength() };
  $("lockup").style.transform = `scale(${scale})`;
  $("word").style.left = wordX + "px"; $("word").style.top = wordY + "px";
  const u = $("under");
  u.style.left = (wordX + splLeft + 6) + "px"; u.style.width = (splW - 12) + "px";
  u.style.height = (tall ? 26 : 12) + "px"; u.style.borderRadius = (tall ? 13 : 6) + "px";
  u.style.top = (wordY + 150 * 0.86 + (tall ? 38 : 24)) + "px";
}

function paint(t) {
  const T = TIMELINE;
  // 1. dot falls into place (in reduced motion: fades in place)
  const d = prog(t, T.dotFall);
  const dotOff = REDUCED ? 0 : lerp(-260, 0, fall(d));
  const dotOp = REDUCED ? settle(d) : 1; // on screen from frame 0: no empty opening
  for (const id of ["dotY", "dotK"]) { $(id).setAttribute("transform", `translate(0 ${dotOff})`); $(id).style.opacity = dotOp; }

  // 2. question curve draws upward from the dot
  const q = prog(t, T.qDraw);
  for (const id of ["qY", "qK"]) {
    const p = $(id);
    p.style.strokeDasharray = L.len;
    // path starts at the top; draw it from the dot end by offsetting the other way
    p.style.strokeDashoffset = REDUCED ? 0 : -L.len * (1 - settle(q));
    p.style.opacity = REDUCED ? settle(q) : (q > 0 ? 1 : 0);
  }

  // 3. tile grows from the centre of the mark; the ? reads as ink where it covers
  const g = settle(prog(t, T.tileGrow));
  const s = REDUCED ? (g > 0 ? 1 : 0) : g;
  const tr = `translate(${100 * (1 - s)} ${100 * (1 - s)}) scale(${s})`;
  $("tile").setAttribute("transform", tr); $("clipRect").setAttribute("transform", tr);
  $("tile").style.opacity = REDUCED ? g : 1;
  $("clipRect").setAttribute("opacity", 1);
  if (REDUCED) { $("qK").style.opacity = g * $("qY").style.opacity; $("dotK").style.opacity = g * dotOp; }

  // 4. reframe: mark moves from frame centre to its lockup place
  const r = REDUCED ? 1 : glide(prog(t, T.reframe));
  const mx = lerp(0, L.markX, r), my = lerp(0, L.markY, r);
  $("mark").style.transform = `translate(${mx}px, ${my}px) scale(${L.MS})`;

  // 5. wordmark wipes out from behind the mark (stacked: wipes left to right in place)
  const w = prog(t, T.wordWipe);
  const word = $("word");
  if (REDUCED) { word.style.clipPath = "none"; word.style.opacity = settle(w); word.style.transform = "none"; }
  else {
    const k = settle(w);
    word.style.opacity = 1;
    const tx = L.tall ? 0 : lerp(-90, 0, k);
    // horizontal: letters may only exist to the right of the moving mark, so the name emerges from it
    const leftCut = L.tall ? 0 : Math.max(0, mx + 100 * L.MS + 10 - (L.wordX + tx));
    // stacked: letters may only exist below the rising mark
    const topCut = L.tall ? Math.max(0, my + 100 * L.MS + 8 - L.wordY) : 0;
    word.style.clipPath = topCut > 0 ? `inset(${topCut}px ${(1 - k) * 100}% -20% ${leftCut}px)` : `inset(-20% ${(1 - k) * 100}% -20% ${leftCut}px)`;
    word.style.transform = `translateX(${tx}px)`;
  }

  // 6. underline lands under SPLAINED
  const u = settle(prog(t, T.underline));
  $("under").style.transform = REDUCED ? "none" : `scaleX(${u})`;
  $("under").style.opacity = REDUCED ? u : (u > 0 ? 1 : 0);
}

window.seek = t => { if (!L) layout(); paint(Math.max(0, Math.min(TIMELINE.duration, t))); };
window.ready = document.fonts.ready.then(() => { layout(); window.seek(0); return true; });
// live preview when opened directly (?play)
if (new URLSearchParams(location.search).has("play")) {
  window.ready.then(() => { const t0 = performance.now(); const loop = () => { window.seek(((performance.now() - t0) / 1000) % 3.6); requestAnimationFrame(loop); }; loop(); });
}
</script>
</body>
</html>
